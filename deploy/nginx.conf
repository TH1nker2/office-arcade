# ============================================================
# 摸鱼游戏厅 · OFFICE ARCADE — nginx 反向代理配置
#
# 用法：
#   1. 复制到 /etc/nginx/conf.d/office-arcade.conf
#      （Debian/Ubuntu 也可以放 sites-available 再 ln -s 到 sites-enabled）
#   2. 修改 server_name 与 upstream 端口
#   3. nginx -t && nginx -s reload
#
# 应用侧不需要任何改动：
#   前端所有请求都是相对路径（/api/...、/js/...），
#   WebSocket 地址由 location.host 推导
# ============================================================

upstream office_arcade {
    server 127.0.0.1:8090;
    keepalive 32;
}

server {
    listen 80;

    server_name arcade.lan 192.168.1.23;

    client_max_body_size 1m;

    # ---------- WebSocket：必须显式升级 ----------
    location /ws {
        proxy_pass http://office_arcade;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大厅是长连接，别让 nginx 60 秒就掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------- 普通 HTTP ----------
    location / {
        proxy_pass http://office_arcade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 75s;
        proxy_redirect off;

        # 静态资源不要在这里加 expires，否则更新后用户会拿到旧 JS
        # 应用自身已经发了 Cache-Control: no-cache
    }
}

# ---------- 可选：压缩（放在 http{} 里更合适） ----------
