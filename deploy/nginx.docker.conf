# ============================================================
# 摸鱼游戏厅 · nginx（Docker Compose 版）
#
# 由 docker-compose.yml 挂载到 /etc/nginx/conf.d/default.conf
# 后端服务名固定为 app，端口 8090
# ============================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # 用 Docker 内置 DNS 动态解析 app，容器重建换 IP 也不会 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "app:8090";

    # 这些目录不该出现在公网：兜底拦一层（应用自己也做了限制）
    location ~ ^/(data|deploy|tools)/ {
        return 404;
    }

    # ---------- WebSocket ----------
    location /ws {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大厅是长连接，别让默认 60 秒掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------- 普通 HTTP ----------
    location / {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 75s;
        proxy_redirect off;

        # 不要给 js/css 加长缓存，否则更新后用户拿到旧脚本
    }
}
