# ============================================================
# 摸鱼游戏厅 · Docker Compose
#
#   两个「原生镜像」，不构建任何自定义镜像：
#     node:24-alpine   —— 跑服务端
#     nginx:alpine     —— 反向代理 + 统一入口
#
#   代码以只读方式挂载进 app 容器，数据目录单独挂载可写。
#
# 用法：
#   cp .env.example .env        # 可选，改对外端口
#   docker compose up -d
#   docker compose logs -f app
#   浏览器打开 http://<宿主机IP>:8080
#
# 更新代码：git pull && docker compose restart app
# 备份数据：docker compose stop && cp data/arcade.sqlite ...
# ============================================================

name: office-arcade

services:
  app:
    image: node:24-alpine
    container_name: office-arcade-app
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      HOST: 0.0.0.0
      PORT: "8090"
      NODE_ENV: production
      # 镜像里的 Node 若没有 node:sqlite，会自动回退 JSON；
      # 也可以在这里强制指定：
      # ARCADE_STORE: json
    volumes:
      # 代码只读挂载，容器里改不了宿主机文件
      - .:/app:ro
      # 数据库单独挂载，必须可写
      - ./data:/app/data
    expose:
      - "8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/api/board || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - arcade

  nginx:
    image: nginx:alpine
    container_name: office-arcade-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${ARCADE_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - arcade

networks:
  arcade:
    driver: bridge
