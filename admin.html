<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · 摸鱼游戏厅</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ================= 登录 ================= -->
  <section class="screen active" id="admin-login">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="admin-title">管理后台</div>
        <form id="login-form" autocomplete="on">
          <label class="field">
            <span>管理员账号</span>
            <input id="admin-user" maxlength="32" placeholder="admins.json 里的 username" autocomplete="username">
          </label>
          <label class="field">
            <span>密码</span>
            <input id="admin-pass" type="password" maxlength="64" placeholder="password" autocomplete="current-password">
          </label>
          <p class="tip" id="login-tip"></p>
          <button class="btn primary big" id="login-btn" type="submit">登 录</button>
        </form>
      </div>
      <a class="version-chip" href="/">← 返回游戏厅</a>
    </div>
  </section>

  <!-- ================= 后台 ================= -->
  <section class="screen" id="admin-panel">
    <div class="admin-wrap">
      <header class="admin-top">
        <div class="brand-mini">摸鱼游戏厅 · 管理后台</div>
        <span class="admin-badge" id="admin-name">—</span>
        <div class="spacer"></div>
        <span class="admin-stat" id="admin-stat"></span>
        <button class="btn small ghost" id="btn-refresh">刷新</button>
        <a class="btn small ghost" href="/">游戏厅</a>
        <button class="btn small ghost" id="btn-logout">退出</button>
      </header>

      <nav class="admin-tabs" id="admin-tabs">
        <button class="admin-tab on" data-view="users">玩家管理</button>
        <button class="admin-tab" data-view="words">你画我猜词库</button>
      </nav>

      <div class="admin-view" id="view-users">
        <div class="admin-toolbar">
          <input id="search" placeholder="搜索昵称 / 用户名" autocomplete="off">
          <label class="admin-check"><input type="checkbox" id="only-online"> 只看在线</label>
          <div class="spacer"></div>
          <span class="admin-hint" id="hint"></span>
        </div>

        <div class="admin-table" id="user-table"></div>
      </div>

      <div class="admin-view hidden" id="view-words">
        <div class="admin-toolbar">
          <div class="seg admin-levels" id="word-levels">
            <button class="seg-btn on" data-level="easy">简单 <span class="seg-num">—</span></button>
            <button class="seg-btn" data-level="normal">中等 <span class="seg-num">—</span></button>
            <button class="seg-btn" data-level="hard">困难 <span class="seg-num">—</span></button>
          </div>
          <input id="word-search" placeholder="搜索关键词或提示" autocomplete="off">
          <div class="spacer"></div>
          <span class="admin-hint" id="word-hint">词库加载中…</span>
        </div>
        <div class="admin-table" id="word-table"></div>
      </div>
    </div>
  </section>

  <!-- ================= 通用弹窗 ================= -->
  <div class="overlay hidden" id="dialog">
    <div class="panel narrow">
      <h2 class="panel-title" id="dlg-title">确认</h2>
      <p class="panel-sub" id="dlg-text"></p>
      <div class="field hidden" id="dlg-field">
        <span id="dlg-label">输入</span>
        <input id="dlg-input" autocomplete="off">
      </div>
      <div class="panel-actions">
        <button class="btn primary" id="dlg-ok">确定</button>
        <button class="btn ghost" id="dlg-cancel">取消</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
</div>
<script src="shared/core.js"></script>
<script src="js/core/dom.js"></script>
<script src="js/core/http.js"></script>
<script src="js/admin/dialog.js"></script>
<script src="js/admin/words.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
